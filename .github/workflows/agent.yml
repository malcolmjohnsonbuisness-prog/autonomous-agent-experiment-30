name: Agent Workflow

'on':
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'
    - cron: '0 22 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tweepy

      - name: Check halted status
        id: halted
        shell: bash
        run: |
          if [ -f state/HALTED ]; then
            echo "halted=true" >> "$GITHUB_OUTPUT"
            echo "Agent is halted; skipping agent commands."
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Produce content
        if: steps.halted.outputs.halted == 'false' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * *' || github.event.schedule == '30 14 * * *')
        run: python agent.py produce

      - name: Publish due content
        if: steps.halted.outputs.halted == 'false' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *')
        run: python agent.py publish

      - name: Analyze and adapt
        if: steps.halted.outputs.halted == 'false' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *')
        run: python agent.py analyze
